name: Build and Release Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.3.0.4) - leave blank to read from Package.appxmanifest'
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version + publisher from manifest
        id: meta
        shell: pwsh
        run: |
          [xml]$m = Get-Content QuickNotes/Package.appxmanifest
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) { $ver = $m.Package.Identity.Version }
          $pub = $m.Package.Identity.Publisher
          Write-Host "version=$ver  publisher=$pub"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publisher=$pub" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build x64 and stage it
        shell: pwsh
        run: |
          $ver = '${{ steps.meta.outputs.version }}'
          dotnet build QuickNotes/QuickNotes.csproj -c Release `
            -p:Platform=x64 -r win-x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:QuickNotesVersion=$ver
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          $b = Get-ChildItem -Path QuickNotes/AppPackages -Filter '*_x64.msixbundle' -Recurse |
               Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $b) { throw 'x64 .msixbundle not produced' }
          Copy-Item $b.FullName "staging/$($b.Name)"
          Write-Host "Staged x64: $($b.Name)"

      # arm64 is cross-compiled on the x64 runner; it needs SelfContained=true
      # (the implicit self-contained setting only applies when RID == host arch).
      - name: Build arm64 and stage it
        shell: pwsh
        run: |
          $ver = '${{ steps.meta.outputs.version }}'
          dotnet build QuickNotes/QuickNotes.csproj -c Release `
            -p:Platform=ARM64 -r win-arm64 `
            -p:SelfContained=true `
            -p:GenerateAppxPackageOnBuild=true `
            -p:QuickNotesVersion=$ver
          $b = Get-ChildItem -Path QuickNotes/AppPackages -Filter '*_arm64.msixbundle' -Recurse |
               Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $b) { throw 'arm64 .msixbundle not produced' }
          Copy-Item $b.FullName "staging/$($b.Name)"
          Write-Host "Staged arm64: $($b.Name)"

      - name: Create self-signed certificate (matches manifest publisher)
        id: create_cert
        shell: pwsh
        run: |
          $pub = '${{ steps.meta.outputs.publisher }}'
          $pwd = ConvertTo-SecureString 'TempCert123!' -AsPlainText -Force
          $cert = New-SelfSignedCertificate -Subject $pub `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyUsage DigitalSignature -Type CodeSigningCert `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          $pfx = Join-Path $env:GITHUB_WORKSPACE 'QuickNotes_ReleaseCert.pfx'
          $cer = Join-Path $env:GITHUB_WORKSPACE 'QuickNotes_ReleaseCert.cer'
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath $pfx -Password $pwd | Out-Null
          Export-Certificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath $cer | Out-Null
          "pfx=$pfx" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "cer=$cer" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Sign all staged packages
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          Get-ChildItem 'staging\*.msixbundle' | ForEach-Object {
            & $signtool sign /fd SHA256 /f ${{ steps.create_cert.outputs.pfx }} /p 'TempCert123!' $_.FullName 2>&1 | Select-Object -Last 2
            $s = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name) -> $($s.Status)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: QuickNotes-v${{ steps.meta.outputs.version }}
          path: |
            staging
            QuickNotes_ReleaseCert.cer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Quick Notes v${{ steps.meta.outputs.version }}
          files: |
            staging/QuickNotes_*_x64.msixbundle
            staging/QuickNotes_*_arm64.msixbundle
            QuickNotes_ReleaseCert.cer
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
