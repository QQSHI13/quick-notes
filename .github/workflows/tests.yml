name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore QuickNotes.sln

      - name: Build (Debug, x64)
        run: dotnet build QuickNotes.sln -c Debug -p:Platform=x64

      # Run the test project directly with -p:Platform=x64 so its main-project
      # dependency (an MSIX-packaged WinExe, which cannot be AnyCPU) builds as x64.
      - name: Test
        run: dotnet test QuickNotes.Tests\QuickNotes.Tests.csproj -c Debug -p:Platform=x64 --no-build --verbosity normal
