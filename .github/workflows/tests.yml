name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore QuickNotes.sln

      - name: Build (Debug, x64)
        run: dotnet build QuickNotes.sln -c Debug -p:Platform=x64

      - name: Test
        run: dotnet test QuickNotes.sln -c Debug -p:Platform=x64 --no-build --verbosity normal
